<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Pretendard, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Shared project-figure style: 800 nm red, 400 nm blue, white light rainbow, NOPA green; dark mirrors, gray beam splitters, beige crystals -->
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CD9"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E5383B"/></marker>
  </defs>
  <rect width="400" height="300" fill="#fff"/>
  <g transform="translate(0,22)">

  <g fill="none" stroke-width="4" stroke-linecap="round">
    <!-- 800 nm focused into BBO -->
    <path d="M20,150 H186" stroke="#E5383B"/>
    <!-- after BBO: residual 800 nm and generated 400 nm -->
    <path d="M210,154 H296" stroke="#E5383B"/>
    <path d="M304,154 H372" stroke="#E5383B" stroke-opacity="0.4" marker-end="url(#ar-red)"/>
    <path d="M210,146 H306 V44" stroke="#2B6CD9" marker-end="url(#ar-blue)"/>
  </g>

  <!-- optics -->
  <path d="M110,112 Q126,150 110,188 Q94,150 110,112 Z" fill="#DCEAF5" stroke="#7A8A99" stroke-width="2"/>
  <rect x="188" y="126" width="20" height="48" rx="2" fill="#F6E7B8" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="284" y1="170" x2="318" y2="136" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>

  <!-- labels -->
  <g font-size="20" fill="#333">
    <text x="20" y="134" fill="#E5383B">800 nm</text>
    <text x="90" y="214">Lens</text>
    <text x="178" y="200">BBO</text>
    <text x="318" y="194">DM</text>
    <text x="318" y="70" fill="#2B6CD9" font-weight="700" font-size="22">400 nm</text>
  </g>
  </g>
</svg>
