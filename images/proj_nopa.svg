<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Pretendard, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Shared project-figure style: 800 nm red, 400 nm blue, white light rainbow, NOPA green; dark mirrors, gray beam splitters, beige crystals -->
  <defs>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1FA45B"/></marker>
    <linearGradient id="wl" gradientUnits="userSpaceOnUse" x1="104" y1="170" x2="194" y2="86">
      <stop offset="0" stop-color="#E5383B"/><stop offset="0.3" stop-color="#F59E0B"/><stop offset="0.5" stop-color="#FACC15"/><stop offset="0.75" stop-color="#22C55E"/><stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#fff"/>

  <g fill="none" stroke-width="4" stroke-linecap="round">
    <!-- 800 nm in, split by the beam splitter -->
    <path d="M20,250 H104 V186" stroke="#E5383B"/>
    <path d="M104,250 H304 V192" stroke="#E5383B"/>
    <!-- white light from WLG and 400 nm from BBO meet in the NOPA crystal -->
    <path d="M104,170 L194,86" stroke="url(#wl)"/>
    <path d="M304,176 L206,86" stroke="#2B6CD9"/>
    <!-- NOPA output -->
    <path d="M200,68 V22" stroke="#1FA45B" marker-end="url(#ar-green)"/>
  </g>

  <!-- optics -->
  <line x1="90" y1="264" x2="118" y2="236" stroke="#9AA3AD" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="264" x2="318" y2="236" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/>
  <rect x="89" y="171" width="30" height="14" rx="2" fill="#F6E7B8" stroke="#6B6B6B" stroke-width="2"/>
  <rect x="289" y="177" width="30" height="14" rx="2" fill="#F6E7B8" stroke="#6B6B6B" stroke-width="2"/>
  <rect x="182" y="70" width="36" height="16" rx="2" fill="#F6E7B8" stroke="#6B6B6B" stroke-width="2"/>

  <!-- labels -->
  <g font-size="20" fill="#333">
    <text x="20" y="236" fill="#E5383B">800 nm</text>
    <text x="96" y="290">BS</text>
    <text x="26" y="184">WLG</text>
    <text x="328" y="190">BBO</text>
    <text x="300" y="138" fill="#2B6CD9">400 nm</text>
    <text x="214" y="40" fill="#1FA45B" font-weight="700" font-size="22">NOPA</text>
  </g>
</svg>
